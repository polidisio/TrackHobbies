  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

  tr:last-child td { border-bottom: 0; }

  details { margin-top: 2px; } summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  details ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  ol.steps { margin: 6px 0 0; padding-left: 20px; } ol.steps li { margin: 4px 0; }
  ul.plain { margin: 6px 0 0; padding-left: 18px; } ul.plain li { margin: 3px 0; }

  .callout b { display: block; margin-bottom: 2px; }
