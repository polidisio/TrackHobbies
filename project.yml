name: TrackHobbies
options:
  bundleIdPrefix: com.trackhobbies
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: es

settings:
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      # XcodeGen sin presets no define DEBUG: sin esto `#if DEBUG` nunca se cumple.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  base:
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # PostHog (SPM) no enlaza en x86_64 del simulador; los Mac y simuladores actuales son arm64.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.86.0

targets:
  TrackHobbies:
    type: application
    platform: iOS
    sources:
      - path: AppMain.swift
      - path: BookStore.swift
      - path: ContentView.swift
      - path: Models
      - path: Services
      - path: Utils
      - path: Theme
      - path: Views
      - path: ViewModels
      - path: Assets.xcassets
      - path: Localizable.xcstrings
      - path: PrivacyInfo.xcprivacy
      # Visibles en el navegador de Xcode, no se compilan:
      - path: Config
        buildPhase: none
      - path: worker
        buildPhase: none
        excludes: ["node_modules/**", ".wrangler/**", "package-lock.json"]
      - path: README.md
        buildPhase: none
      - path: CLAUDE.md
        buildPhase: none
      - path: AGENTS.md
        buildPhase: none
    settings:
      configs:
        # Debug = app aparte (otro bundle id): no se mezcla con TestFlight en el mismo dispositivo.
        # Mismo contenedor de iCloud; Debug usa el entorno Development.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.trackhobbies.app.dev
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.trackhobbies.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TrackHobbies.entitlements
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: PostHog
    entitlements:
      path: TrackHobbies.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.trackhobbies.app
        com.apple.developer.icloud-services:
          - CloudKit
        # CloudKit avisa de cambios remotos por push silencioso; sin esto no hay sync en vivo.
        # Xcode lo cambia a `production` al firmar para TestFlight/App Store.
        aps-environment: development
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TrackHobbies
        CFBundleName: TrackHobbies
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        GameAPIHost: "$(GAME_API_HOST)"
        GameAPIToken: "$(GAME_API_TOKEN)"
        PostHogAPIKey: "$(POSTHOG_API_KEY)"
        PostHogHost: "$(POSTHOG_HOST)"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true

  TrackHobbiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TrackHobbies
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.trackhobbies.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TrackHobbies.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TrackHobbies"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TrackHobbies:
    build:
      targets:
        TrackHobbies: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrackHobbiesTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
